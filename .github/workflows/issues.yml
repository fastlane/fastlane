---
name: Process issues
on:
  issues:
    types:
      - opened
permissions:
  issues: write

jobs:
  fastlane-env:
    name: Remind user about posting their fastlane env
    runs-on: ubuntu-latest
    steps:
      - uses: fastlane/github-actions/fastlane-env-reminder@0f64d079e31de0c707831cedb420443931098984 # v0.9.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
