name: PR Checks

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-checks:
    name: Run PR checks
    runs-on: ubuntu-latest

    steps:
      # `pull_request_target` checks out the base branch, so the script we run below is
      # always the trusted one from the target branch, never the one from the pull request.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v8
        with:
          script: |
            const prChecks = require('./.github/scripts/pr-checks.js');
            await prChecks({ github, context });
