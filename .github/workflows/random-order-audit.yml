# Runs the suite in a random order, on this branch only.
#
# The suite is order dependent today (fastlane#30184): specs leak module level
# state, so whether a file passes depends on what ran before it. That blocks
# parallelising the suite, and it is invisible while everything runs in the one
# order rspec happens to load files in.
#
# This job is expected to be red. It exists so the failures are visible and can
# be worked through, either on this branch or as small separate PRs that merge
# to master on their own. It is scoped to this branch by name, so merging it
# never turns it on for master.
name: Random order audit

on:
  push:
    branches: [chore/random_order_audit]
  workflow_dispatch:
    inputs:
      seed:
        description: "rspec seed, to reproduce a previous run. Leave blank for a new random order."
        required: false
        type: string

permissions:
  contents: read

jobs:
  random_order:
    name: "Random order, Xcode 16.4.0, Ruby 3.4"
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4.0'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Increase Open File Limit
        shell: bash
        run: ulimit -n 65536

      - name: Run the suite in a random order
        env:
          # Unpinned. Seeds 48174, 1150, 21323 and 40083 are all green, and the
          # environment guard closed a whole class of ordering defect rather
          # than one seed's worth, so pinning would now sample less than a fresh
          # order does. Pass a seed to the workflow_dispatch input to reproduce
          # a particular run; pin here again only if a fix needs successive runs
          # to be comparable while it is worked through.
          RSPEC_ARGS: "--order random${{ inputs.seed && format(':{0}', inputs.seed) || '' }}"
          # The console summary prints three example ids per variable, which is
          # not enough to work from when a variable has over a thousand. The
          # full inventory goes to a file and is uploaded below.
          FASTLANE_SPEC_ENV_GUARD_REPORT: env_guard_leaks.txt
        shell: bash
        run: |
          echo "RSPEC_ARGS=$RSPEC_ARGS"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          bundle exec fastlane execute_tests

      - name: RSpec report
        if: always()
        uses: SonicGarden/rspec-report-action@v8
        with:
          json-path: rspec_logs.json
          comment: 'false'
          title: '# :game_die: Random order failures'

      # The guard restores ENV after every example, so this inventory is the
      # same whatever order the run used. It is the input to the environment
      # section of internal/order_dependent_specs.md.
      - name: Environment guard inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: env-guard-leaks
          path: env_guard_leaks.txt
          if-no-files-found: ignore

  order_dependent_subset:
    name: "Known order dependent specs, random order"
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4.0'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Increase Open File Limit
        shell: bash
        run: ulimit -n 65536

      # Runs only the files in internal/order_dependent_specs.md. A smaller set
      # means a different ordering, so this samples contexts the full run never
      # produces, and it finishes in a fraction of the time. It is a sampler and
      # not a gate: green here does not mean the suite is order independent.
      # No seed is pinned on purpose, so each run is a fresh sample.
      - name: Run the known order dependent specs
        shell: bash
        run: bundle exec rake test_order_dependent

  parallel_split:
    name: "Parallel split, workers ${{ matrix.workers }}"
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        workers: [2, 4, 6]
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4.0'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Increase Open File Limit
        shell: bash
        run: ulimit -n 65536

      # Measures what a split costs and buys on a runner rather than on a
      # developer machine. Locally, on 14 cores, the suite goes from 276s to 50s
      # at eight workers and stops improving after that: the timings are taken
      # from a single process, and under that much concurrency each example
      # takes about twice as long. A runner has far fewer cores, so the useful
      # number is expected to be lower and the matrix is here to find it.
      #
      # Also a second order dependence check: a worker sees a subset no seed
      # ever produces, which is how rows T and Z were found.
      - name: Run the suite as ${{ matrix.workers }} processes
        shell: bash
        env:
          WORKERS: ${{ matrix.workers }}
        run: bundle exec rake test_parallel
