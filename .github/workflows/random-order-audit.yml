# Runs the suite in a random order, on this branch only.
#
# The suite is order dependent today (fastlane#30184): specs leak module level
# state, so whether a file passes depends on what ran before it. That blocks
# parallelising the suite, and it is invisible while everything runs in the one
# order rspec happens to load files in.
#
# This job is expected to be red. It exists so the failures are visible and can
# be worked through, either on this branch or as small separate PRs that merge
# to master on their own. It is scoped to this branch by name, so merging it
# never turns it on for master.
name: Random order audit

on:
  push:
    branches: [chore/random_order_audit]
  workflow_dispatch:
    inputs:
      seed:
        description: "rspec seed, to reproduce a previous run. Leave blank for a new random order."
        required: false
        type: string
      record_timings:
        description: "Record spec timings on the runner and upload them, instead of running the audit. The split is balanced from these, and they are per platform because the suite is a different shape on each."
        required: false
        type: choice
        options: ["no", "macos", "linux", "both"]
        default: "no"

permissions:
  contents: read

jobs:
  random_order:
    if: inputs.record_timings == 'no' || inputs.record_timings == null
    name: "Random order, Xcode 16.4.0, Ruby 3.4"
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4.0'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Increase Open File Limit
        shell: bash
        run: ulimit -n 65536

      - name: Run the suite in a random order
        env:
          # Unpinned. Seeds 48174, 1150, 21323 and 40083 are all green, and the
          # environment guard closed a whole class of ordering defect rather
          # than one seed's worth, so pinning would now sample less than a fresh
          # order does. Pass a seed to the workflow_dispatch input to reproduce
          # a particular run; pin here again only if a fix needs successive runs
          # to be comparable while it is worked through.
          RSPEC_ARGS: "--order random${{ inputs.seed && format(':{0}', inputs.seed) || '' }}"
          # The console summary prints three example ids per variable, which is
          # not enough to work from when a variable has over a thousand. The
          # full inventory goes to a file and is uploaded below.
          FASTLANE_SPEC_ENV_GUARD_REPORT: env_guard_leaks.txt
        shell: bash
        run: |
          echo "RSPEC_ARGS=$RSPEC_ARGS"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          bundle exec fastlane execute_tests

      - name: RSpec report
        if: always()
        uses: SonicGarden/rspec-report-action@v8
        with:
          json-path: rspec_logs.json
          comment: 'false'
          title: '# :game_die: Random order failures'

      # The guard restores ENV after every example, so this inventory is the
      # same whatever order the run used. It is the input to the environment
      # section of internal/order_dependent_specs.md.
      - name: Environment guard inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: env-guard-leaks
          path: env_guard_leaks.txt
          if-no-files-found: ignore

  order_dependent_subset:
    if: inputs.record_timings == 'no' || inputs.record_timings == null
    name: "Known order dependent specs, random order"
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4.0'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Increase Open File Limit
        shell: bash
        run: ulimit -n 65536

      # Runs only the files in internal/order_dependent_specs.md. A smaller set
      # means a different ordering, so this samples contexts the full run never
      # produces, and it finishes in a fraction of the time. It is a sampler and
      # not a gate: green here does not mean the suite is order independent.
      # No seed is pinned on purpose, so each run is a fresh sample.
      - name: Run the known order dependent specs
        shell: bash
        run: bundle exec rake test_order_dependent

  parallel_split:
    if: inputs.record_timings == 'no' || inputs.record_timings == null
    name: "Parallel split, workers ${{ matrix.workers }}"
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        workers: [2, 4, 6]
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4.0'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Increase Open File Limit
        shell: bash
        run: ulimit -n 65536

      # Measures what a split costs and buys on a runner rather than on a
      # developer machine. Locally, on 14 cores, the suite goes from 276s to 50s
      # at eight workers and stops improving after that: the timings are taken
      # from a single process, and under that much concurrency each example
      # takes about twice as long. A runner has far fewer cores, so the useful
      # number is expected to be lower and the matrix is here to find it.
      #
      # Also a second order dependence check: a worker sees a subset no seed
      # ever produces, which is how rows T and Z were found.
      - name: Run the suite as ${{ matrix.workers }} processes
        shell: bash
        env:
          WORKERS: ${{ matrix.workers }}
        run: bundle exec rake test_parallel

  random_order_linux:
    if: inputs.record_timings == 'no' || inputs.record_timings == null
    name: "Random order, Linux, Ruby 3.1"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Increase Open File Limit
        shell: bash
        run: ulimit -n 65536

      # A different shape of suite, not just a different runner. Without Xcode
      # the requires_xcodebuild and requires_keychain specs skip, which is 61%
      # of the example time on macOS, so both the ordering and the timings are
      # worth measuring separately rather than assumed from the mac numbers.
      - name: Run the suite in a random order
        shell: bash
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          bundle exec rake test_all

      - name: RSpec report
        if: always()
        uses: SonicGarden/rspec-report-action@v8
        with:
          json-path: rspec_logs.json
          comment: 'false'
          title: '# :penguin: Random order failures, Linux'

  parallel_split_linux:
    if: inputs.record_timings == 'no' || inputs.record_timings == null
    name: "Parallel split on Linux, workers ${{ matrix.workers }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        workers: [2, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Increase Open File Limit
        shell: bash
        run: ulimit -n 65536

      # The useful worker count is expected to differ here. On macOS each worker
      # drags an xcodebuild child along with it, so the knee sits near half the
      # core count. Without Xcode there are far fewer subprocesses.
      - name: Run the suite as ${{ matrix.workers }} processes
        shell: bash
        env:
          WORKERS: ${{ matrix.workers }}
        run: bundle exec rake test_parallel

  isolated_home:
    if: inputs.record_timings == 'no' || inputs.record_timings == null
    name: "Isolated HOME, workers 4"
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4.0'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Increase Open File Limit
        shell: bash
        run: ulimit -n 65536

      # Runs against a home directory the run controls, so that a spec depending
      # on state an earlier run left in ~ fails here. Row Z was exactly that and
      # survived for months because every machine that had run the suite already
      # had the file it needed. Locally this costs about 7%.
      - name: Run the suite with an isolated HOME
        shell: bash
        env:
          WORKERS: 4
        run: bundle exec rake test_isolated

  record_timings:
    name: "Record spec timings, ${{ matrix.platform }}"
    if: inputs.record_timings != 'no' && inputs.record_timings != null
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ inputs.record_timings == 'both' && fromJSON('["macos","linux"]') || fromJSON(format('["{0}"]', inputs.record_timings)) }}
    runs-on: ${{ matrix.platform == 'macos' && 'macos-15' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        if: matrix.platform == 'macos'
        with:
          xcode-version: '16.4.0'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.platform == 'macos' && '3.4' || '3.1' }}
          bundler-cache: true

      - name: Increase Open File Limit
        shell: bash
        run: ulimit -n 65536

      # One process, deliberately. Per file durations are only meaningful when
      # nothing else is competing, and the whole point of recording them here is
      # that a runner's numbers differ from a laptop's: on Linux the
      # requires_xcodebuild specs skip, which is 61% of the macOS example time,
      # so a split balanced from macOS numbers leaves a Linux worker idle 41% to
      # 48% of the run.
      - name: Record timings
        shell: bash
        run: bundle exec rake spec_timings

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: spec-timings-${{ matrix.platform }}
          path: internal/spec_timings.*.json
          if-no-files-found: error
