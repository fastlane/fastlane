name: Tests on a chosen Ruby and Xcode

on:
  workflow_dispatch:
    inputs:
      ruby:
        description: 'Ruby version known to ruby/setup-ruby, e.g. 4.1.0-preview1 or head'
        required: true
        default: '4.1.0-preview1'
      xcode:
        description: 'Xcode version installed on the macOS runner, e.g. 16.4 on macos-15, 26.6 on macos-26, 27.0 on xcode-27'
        required: true
        default: '26.6'
      os:
        description: 'Runner'
        type: choice
        options: [macos-26, macos-15, xcode-27, ubuntu-24.04, windows-2022]
        default: macos-26
      warnings:
        description: 'Record Ruby warnings, deprecations included, and summarise them'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    name: ${{ inputs.os }}, Xcode ${{ inputs.xcode }}, Ruby ${{ inputs.ruby }} Tests
    runs-on: ${{ inputs.os }}
    env:
      # Keeps Bundler from switching back to the lockfile's 2.7.2 during bundle install
      BUNDLER_VERSION: '4'
      # Read by spec/spec_helper.rb and rake warnings_summary; empty when not recording
      FASTLANE_SPEC_WARNINGS: ${{ inputs.warnings && 'spec_warnings' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode ${{ inputs.xcode }}
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ inputs.xcode }}

      - name: Debug | Xcode version
        if: runner.os == 'macOS'
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Set up Ruby ${{ inputs.ruby }}
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ inputs.ruby }}
          # The lockfile's Bundler may not run on a preview Ruby: 2.7.2 does not on 4.1.0-preview1
          bundler: latest
          bundler-cache: true

      - name: Increase Open File Limit
        if: runner.os != 'Windows'
        shell: bash
        run: ulimit -n 65536

      - name: Run tests
        id: tests
        env:
          # -W0 would also silence the warnings being recorded
          RUBYOPT: ${{ !inputs.warnings && '-W0' || '' }}
          FASTLANE_SPEC_WORKERS: '4'
        shell: bash
        run: |
          ruby -v
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          bundle exec fastlane execute_tests

      - name: Summarise the Ruby warnings
        # Not when setup failed and the tests never ran
        if: always() && inputs.warnings && steps.tests.outcome != 'skipped'
        shell: bash
        run: bundle exec rake warnings_summary

      - name: Keep the worker logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rspec-worker-logs-${{ inputs.os }}-xcode${{ inputs.xcode }}-ruby${{ inputs.ruby }}
          path: |
            rspec_worker_*.log
            rspec_worker_*.units
            spec_warnings/
          if-no-files-found: warn
