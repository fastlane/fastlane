---
name: Process release
on:
  workflow_run:
    workflows: ["Release Step 2 - Create GitHub Release"]
    branches:
      - master
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to announce'
        required: true
permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  announce-release-on-released-pull-requests:
    name: Announce release on released pull requests
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Download release tag artifact
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: release_tag

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ ! -f "latest_fl_version.txt" ]; then
              echo "latest_fl_version.txt not found in expected locations"
              exit 1
            fi
            version=$(cat latest_fl_version.txt)
          else
            version="$INPUT_VERSION"
          fi
          # The artifact comes from another workflow run: accept a version number and nothing else
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing unexpected version: '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Announce release on released pull requests
        uses: fastlane/github-actions/communicate-on-pull-request-released@latest
        with:
          version: ${{ steps.version.outputs.version }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
