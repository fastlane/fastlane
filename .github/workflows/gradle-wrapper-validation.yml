# Checks every gradle-wrapper.jar in the repository against the checksums of the official Gradle releases.
# Runs on every push to master, so there is always a successful run for OpenSSF Scorecard, which stops counting
# the jars as unreviewed binaries once it finds one.
name: Gradle wrapper validation

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
