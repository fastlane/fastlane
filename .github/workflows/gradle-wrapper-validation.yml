# Checks every gradle-wrapper.jar in the repository against the checksums of the official Gradle releases.
# Pull requests run it only when they touch a jar. Pushes to master always run it: OpenSSF Scorecard counts the
# jars as unreviewed binaries unless the latest commit on master has a successful run of this workflow.
name: Gradle wrapper validation

on:
  push:
    branches: [ master ]
  pull_request:
    paths:
      - '**/gradle-wrapper.jar'
      - '.github/workflows/gradle-wrapper-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
