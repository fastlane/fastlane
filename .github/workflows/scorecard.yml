name: Scorecard supply-chain security
on:
  # For the Branch-Protection check. Only the default branch is supported.
  branch_protection_rule:
  # Keeps the Maintained check up to date.
  schedule:
    - cron: "30 4 * * 1" # Every Monday at 04:30 UTC
  push:
    branches: [master]

permissions: read-all

jobs:
  # Scorecard flags the gradle-wrapper.jar files unless this commit already has a successful gradle-wrapper-validation.yml
  # run; it lost that race on 2 of 8 pushes. The analysis job itself may only use approved actions, so the wait is here.
  wait-for-gradle-wrapper-validation:
    name: Wait for the Gradle wrapper validation
    runs-on: ubuntu-24.04
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      actions: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 30); do
            conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow gradle-wrapper-validation.yml --commit "$GITHUB_SHA" --json conclusion -q '.[0].conclusion')
            [ -n "$conclusion" ] && echo "Gradle wrapper validation: $conclusion" && exit 0
            sleep 10
          done
          echo "::warning::No finished Gradle wrapper validation for $GITHUB_SHA after 5 minutes"

  analysis:
    name: Scorecard analysis
    needs: wait-for-gradle-wrapper-validation
    runs-on: ubuntu-latest
    # `publish_results: true` only works when run from the default branch.
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      # Needed to upload the results to the code scanning dashboard.
      security-events: write
      # Needed to publish the results to the OpenSSF API.
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
