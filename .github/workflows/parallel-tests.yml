# Runs the spec suite as several independent rspec processes.
#
# Two purposes, and they are related. It is much faster than a single process,
# 562s down to about 150s on a macOS runner. And a split is a harsher test of
# spec isolation than any seed: a worker sees a subset no random order ever
# produces, so a spec that depends on another file having run first fails here.
# Combined with `--order random` it exercises both axes at once, which is how
# the pty exit status defect (#30188) was found.
#
# While the isolation work from #30184 is still landing this will be red, and
# that is the point: it is the monitor for that work.
name: Parallel tests

on:
  pull_request:
    paths:
      - 'internal/rakelib/parallel.rake'
      - 'internal/spec_timings.*.json'
      - '.github/workflows/parallel-tests.yml'
  schedule:
    # 04:00 UTC on the first of January, April, July and October.
    #
    # Quarterly is a compromise. The timings only shift when the shape of the
    # suite changes, so they do not need refreshing often, and a stale file
    # costs a worse split rather than a wrong result. But a workflow nobody runs
    # is a workflow that has quietly stopped working, and this one is only
    # otherwise triggered by pull requests that touch the parallel machinery,
    # which may be months apart. Running the whole thing four times a year keeps
    # it honest without spending much.
    - cron: '0 4 1 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      record_timings:
        description: "Record spec timings instead of running the split. The split is balanced from these, and they are per platform because the suite is a different shape on each."
        required: false
        type: choice
        options: ["no", "macos", "linux", "windows", "both"]
        default: "no"
      workers:
        description: "Workers per runner. Four has measured best on the macOS and Linux runners."
        required: false
        type: string
        default: "4"

permissions:
  contents: read

jobs:
  split_macos:
    name: "Split, macOS"
    if: inputs.record_timings == 'no' || inputs.record_timings == null
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4.0'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Increase Open File Limit
        shell: bash
        run: ulimit -n 65536
      - name: Run the suite split across workers, in a random order
        shell: bash
        env:
          WORKERS: ${{ inputs.workers || '4' }}
          RSPEC_ARGS: "--order random"
        run: bundle exec rake test_parallel

      # The worker logs hold the actual failure messages. The task prints which
      # examples failed, but a split only failure needs the reason and the
      # bucket that produced it, and neither survives the runner otherwise.
      - name: Keep the worker logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rspec-worker-logs-macos
          path: |
            rspec_worker_*.log
            rspec_worker_*.units
          if-no-files-found: warn

  split_linux:
    name: "Split, Linux"
    if: inputs.record_timings == 'no' || inputs.record_timings == null
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Increase Open File Limit
        shell: bash
        run: ulimit -n 65536
      # Without Xcode the requires_xcodebuild and requires_keychain specs skip,
      # which is most of the example time on macOS. A different shape of suite,
      # so worth splitting separately and balancing from its own timings.
      - name: Run the suite split across workers, in a random order
        shell: bash
        env:
          WORKERS: ${{ inputs.workers || '4' }}
          RSPEC_ARGS: "--order random"
        run: bundle exec rake test_parallel

      # The worker logs hold the actual failure messages. The task prints which
      # examples failed, but a split only failure needs the reason and the
      # bucket that produced it, and neither survives the runner otherwise.
      - name: Keep the worker logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rspec-worker-logs-linux
          path: |
            rspec_worker_*.log
            rspec_worker_*.units
          if-no-files-found: warn

  split_windows:
    name: "Split, Windows"
    if: inputs.record_timings == 'no' || inputs.record_timings == null
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      # No ulimit step: the open file limit is not a thing to raise here, and
      # there is no Xcode, so this is the Linux shape of the suite again on a
      # third process model. Workers are spawned rather than forked, which is
      # what makes the split possible here at all.
      - name: Run the suite split across workers, in a random order
        shell: bash
        env:
          WORKERS: ${{ inputs.workers || '4' }}
          RSPEC_ARGS: "--order random"
        run: bundle exec rake test_parallel

      # The worker logs hold the actual failure messages. The task prints which
      # examples failed, but a split only failure needs the reason and the
      # bucket that produced it, and neither survives the runner otherwise.
      - name: Keep the worker logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rspec-worker-logs-windows
          path: |
            rspec_worker_*.log
            rspec_worker_*.units
          if-no-files-found: warn

  record_macos:
    name: "Record timings, macOS"
    if: github.event_name == 'schedule' || inputs.record_timings == 'macos' || inputs.record_timings == 'both'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4.0'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Increase Open File Limit
        shell: bash
        run: ulimit -n 65536
      # One process, deliberately: per file durations only mean anything when
      # nothing else is competing for the machine.
      - name: Record timings
        shell: bash
        run: bundle exec rake spec_timings
      - uses: actions/upload-artifact@v4
        with:
          name: spec-timings-macos
          path: internal/spec_timings.mac.json
          if-no-files-found: error

  record_linux:
    name: "Record timings, Linux"
    if: github.event_name == 'schedule' || inputs.record_timings == 'linux' || inputs.record_timings == 'both'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Increase Open File Limit
        shell: bash
        run: ulimit -n 65536
      # Recording here rather than on a laptop is the point: three of the
      # heaviest macOS files cost nothing on Linux, and balancing a Linux split
      # from macOS numbers left a worker idle 41% to 48% of the run.
      - name: Record timings
        shell: bash
        run: bundle exec rake spec_timings
      - uses: actions/upload-artifact@v4
        with:
          name: spec-timings-linux
          path: internal/spec_timings.linux.json
          if-no-files-found: error

  record_windows:
    name: "Record timings, Windows"
    if: github.event_name == 'schedule' || inputs.record_timings == 'windows' || inputs.record_timings == 'both'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Record timings
        shell: bash
        run: bundle exec rake spec_timings
      - uses: actions/upload-artifact@v4
        with:
          name: spec-timings-windows
          path: internal/spec_timings.windows.json
          if-no-files-found: error
