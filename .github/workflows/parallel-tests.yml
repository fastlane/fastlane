# Keeps the per platform spec timings current, and runs the split in a random
# order.
#
# The speed argument for splitting the suite now lives in the CI workflow, which
# runs `rake test_parallel` on every pull request. What is left here is the two
# things that workflow does not do.
#
# Recording the timings. The split is balanced from measured per file durations,
# and they have to come from the platform they balance: 61% of the example time
# on macOS is in files that skip entirely on Linux, and balancing a Linux split
# from macOS numbers left a worker idle 41% to 48% of the run. Each file records
# where it was measured. They only shift when the shape of the suite changes, so
# quarterly is enough, and a stale file costs a worse split rather than a wrong
# result. Recording means a full single process run on each platform, which is
# the expensive half of this workflow and the reason that half stays quarterly.
#
# Running the split in a random order. CI runs it in the defined order, so the
# two axes of isolation are exercised separately there. A worker sees a subset
# no seed produces, and a random order within that subset is the harsher test of
# the two combined. That is how the `DisplayType` global and the pty exit status
# defect (#30188) were found, neither of which had shown up in a random order
# alone.
#
# That half runs weekly, and cheaply: no recording, just the split. It earns it.
# The first time it ran against a changed suite it found two order dependencies
# that had been latent for days, one on Windows and one on macOS, neither of
# them related to the pull request they appeared on. On a pull request trigger
# alone it would have been months before anyone saw either.
#
# Running on a schedule is also what keeps this honest. A workflow nobody runs
# is a workflow that has quietly stopped working.
name: Spec timings and random order split

on:
  pull_request:
    paths:
      - 'internal/rakelib/parallel.rake'
      - 'internal/spec_timings.*.json'
      - '.github/workflows/parallel-tests.yml'
  schedule:
    # Two cadences, told apart by github.event.schedule below.
    #
    # 04:00 UTC every Monday: the random order split only. It found two order
    # dependencies the first time it ran against a changed suite, one on Windows
    # and one on macOS, both of which had been latent for days. Quarterly is too
    # rare to catch that class before it reaches someone.
    - cron: '0 4 * * 1'
    # 04:00 UTC on the first of January, April, July and October: the split and
    # a full single process run per platform to record the timings. That run is
    # the expensive half, and the timings only shift when the shape of the suite
    # does, so it stays quarterly.
    - cron: '0 4 1 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      record_timings:
        description: "Record spec timings instead of running the split. The split is balanced from these, and they are per platform because the suite is a different shape on each. `all` also opens a pull request with the three files, which is how to refresh them without waiting for the quarterly run."
        required: false
        type: choice
        options: ["no", "macos", "linux", "windows", "all"]
        default: "no"
      workers:
        description: "Workers per runner. Four has measured best on all three runners."
        required: false
        type: string
        default: "4"
      stall_probe:
        description: "Run only the stall probe: the CI macOS matrix, recording what a worker waits on when it stalls."
        required: false
        type: boolean
        default: false
      time_simctl:
        description: "Stall probe: time simctl when the job starts and before the tests. This also warms it up."
        required: false
        type: boolean
        default: false
      disable_spotlight:
        description: "Stall probe: turn Spotlight indexing off before the checkout."
        required: false
        type: boolean
        default: false
      warm_up:
        description: "Stall probe: start simctl in the background as the first step, as CI does."
        required: false
        type: boolean
        default: false
      simctl_probe:
        description: "Measurement: time the first simctl call on fresh runners, without the tests."
        required: false
        type: boolean
        default: false
      simctl_call:
        description: "simctl probe: what to run first, list or runfirstlaunch"
        required: false
        type: string
        default: list
      max_parallel:
        description: "Stall probe: how many legs run at once. CI starts all seven together."
        required: false
        type: number
        default: 1

permissions:
  contents: read

env:
  # Git's background maintenance can delete files under .git/objects while a local clone copies them - fastlane/fastlane#30432
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: maintenance.auto
  GIT_CONFIG_VALUE_0: "false"

jobs:
  split_macos:
    name: "Split, macOS"
    if: (inputs.record_timings == 'no' || inputs.record_timings == null) && !inputs.stall_probe && !inputs.simctl_probe
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '16.4.0'
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Increase Open File Limit
        shell: bash
        run: ulimit -n 65536
      - name: Run the suite split across workers, in a random order
        shell: bash
        env:
          FASTLANE_SPEC_WORKERS: ${{ inputs.workers || '4' }}
          RSPEC_ARGS: "--order random"
        run: bundle exec rake test_parallel

      # The worker logs hold the actual failure messages. The task prints which
      # examples failed, but a split only failure needs the reason and the
      # bucket that produced it, and neither survives the runner otherwise.
      - name: Keep the worker logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rspec-worker-logs-macos
          path: |
            rspec_worker_*.log
            rspec_worker_*.units
          if-no-files-found: warn

  split_linux:
    name: "Split, Linux"
    if: (inputs.record_timings == 'no' || inputs.record_timings == null) && !inputs.stall_probe && !inputs.simctl_probe
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Increase Open File Limit
        shell: bash
        run: ulimit -n 65536
      # Without Xcode the requires_xcodebuild and requires_keychain specs skip,
      # which is most of the example time on macOS: 558s there against 106s here.
      - name: Run the suite split across workers, in a random order
        shell: bash
        env:
          FASTLANE_SPEC_WORKERS: ${{ inputs.workers || '4' }}
          RSPEC_ARGS: "--order random"
        run: bundle exec rake test_parallel

      # The worker logs hold the actual failure messages. The task prints which
      # examples failed, but a split only failure needs the reason and the
      # bucket that produced it, and neither survives the runner otherwise.
      - name: Keep the worker logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rspec-worker-logs-linux
          path: |
            rspec_worker_*.log
            rspec_worker_*.units
          if-no-files-found: warn

  split_windows:
    name: "Split, Windows"
    if: (inputs.record_timings == 'no' || inputs.record_timings == null) && !inputs.stall_probe && !inputs.simctl_probe
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.2'
          bundler-cache: true
      # No ulimit step: the open file limit is not a thing to raise here, and
      # there is no Xcode, so this is the Linux shape of the suite again on a
      # third process model. Workers are spawned rather than forked, which is
      # what makes the split possible here at all.
      - name: Run the suite split across workers, in a random order
        shell: bash
        env:
          FASTLANE_SPEC_WORKERS: ${{ inputs.workers || '4' }}
          RSPEC_ARGS: "--order random"
        run: bundle exec rake test_parallel

      # The worker logs hold the actual failure messages. The task prints which
      # examples failed, but a split only failure needs the reason and the
      # bucket that produced it, and neither survives the runner otherwise.
      - name: Keep the worker logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rspec-worker-logs-windows
          path: |
            rspec_worker_*.log
            rspec_worker_*.units
          if-no-files-found: warn

  stall_probe:
    name: "Stall probe, ${{ matrix.os }}, Xcode ${{ matrix.xcode }}, Ruby ${{ matrix.ruby }}"
    if: inputs.stall_probe
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel || 1) }}
      matrix:
        include:
          - { xcode: '16.4.0', ruby: '3.2', rubyopt: '', os: 'macos-15' }
          - { xcode: '16.4.0', ruby: '3.3', rubyopt: '', os: 'macos-15' }
          - { xcode: '16.4.0', ruby: '3.4', rubyopt: '', os: 'macos-15' }
          - { xcode: '26.5', ruby: '3.4', rubyopt: '-W0', os: 'macos-26' }
          - { xcode: '26.6', ruby: '3.4', rubyopt: '-W0', os: 'macos-26' }
          - { xcode: '26.6', ruby: '4.0', rubyopt: '-W0', os: 'macos-26' }
          - { xcode: '27.0', ruby: '4.0', rubyopt: '-W0', os: 'xcode-27' }
    env:
      PROBE_DIR: ${{ github.workspace }}/probe
      TIME_SIMCTL: ${{ inputs.time_simctl }}
    steps:
      - name: Start the simulator service
        if: inputs.warm_up
        run: |
          date -u +"%Y-%m-%d %H:%M:%S" > "$RUNNER_TEMP/probe_start_time.txt"
          nohup xcrun simctl list devices > /dev/null 2>&1 &
      - name: Turn Spotlight off
        if: inputs.disable_spotlight
        run: |
          sudo mdutil -a -i off
          sudo launchctl bootout system/com.apple.metadata.mds || echo "bootout refused"
          sudo killall mds mds_stores mdworker_shared || echo "nothing to kill"
          mdutil -s /
          pgrep -lf 'mds|mdworker' || echo "no mds processes"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start the monitors
        run: internal/ci_stall_probe.sh start && internal/ci_stall_probe.sh snapshot 1-start
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ matrix.xcode }}
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Increase Open File Limit
        run: ulimit -n 65536
      - name: Snapshot before the tests
        run: internal/ci_stall_probe.sh snapshot 2-before-tests
      # As the CI workflow runs them
      - name: Run tests
        env:
          RUBYOPT: ${{ matrix.rubyopt }}
          FASTLANE_SPEC_WORKERS: '4'
          RSPEC_ARGS: "--require ./internal/spec_stall_watchdog.rb"
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          bundle exec fastlane execute_tests
      - name: Snapshot after the tests
        if: always()
        env:
          TIME_SIMCTL: 'true'
        run: internal/ci_stall_probe.sh snapshot 3-after-tests
      - name: Stop the monitors
        if: always()
        run: internal/ci_stall_probe.sh stop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: stall-probe-${{ matrix.os }}-ruby${{ matrix.ruby }}-xcode${{ matrix.xcode }}
          path: |
            probe/
            rspec_worker_*.log
            rspec_worker_*.units
          if-no-files-found: warn

  simctl_probe:
    name: "simctl probe, ${{ matrix.os }}, first call after ${{ matrix.delay }}s, ${{ matrix.rep }}"
    if: inputs.simctl_probe
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, xcode-27]
        delay: [0, 180]
        rep: [1, 2]
    env:
      PROBE_DIR: ${{ github.workspace }}/probe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: internal
      - name: Start watching
        run: internal/ci_simctl_probe.sh start
      - name: Wait before the first call
        run: sleep ${{ matrix.delay }}
      - name: Call simctl
        run: internal/ci_simctl_probe.sh call "${{ inputs.simctl_call }}"
      - name: Wait for simdiskimaged and collect
        if: always()
        run: internal/ci_simctl_probe.sh stop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: simctl-probe-${{ matrix.os }}-delay${{ matrix.delay }}-${{ matrix.rep }}
          path: probe/

  record_macos:
    name: "Record timings, macOS"
    if: github.event.schedule == '0 4 1 1,4,7,10 *' || inputs.record_timings == 'macos' || inputs.record_timings == 'all'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '16.4.0'
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Increase Open File Limit
        shell: bash
        run: ulimit -n 65536
      # One process, deliberately: per file durations only mean anything when
      # nothing else is competing for the machine.
      - name: Record timings
        shell: bash
        run: bundle exec rake spec_timings
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spec-timings-macos
          path: internal/spec_timings.mac.json
          if-no-files-found: error

  record_linux:
    name: "Record timings, Linux"
    if: github.event.schedule == '0 4 1 1,4,7,10 *' || inputs.record_timings == 'linux' || inputs.record_timings == 'all'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Increase Open File Limit
        shell: bash
        run: ulimit -n 65536
      # Recording here rather than on a laptop is the point: three of the
      # heaviest macOS files cost nothing on Linux, and balancing a Linux split
      # from macOS numbers left a worker idle 41% to 48% of the run.
      - name: Record timings
        shell: bash
        run: bundle exec rake spec_timings
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spec-timings-linux
          path: internal/spec_timings.linux.json
          if-no-files-found: error

  record_windows:
    name: "Record timings, Windows"
    if: github.event.schedule == '0 4 1 1,4,7,10 *' || inputs.record_timings == 'windows' || inputs.record_timings == 'all'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Record timings
        shell: bash
        run: bundle exec rake spec_timings
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spec-timings-windows
          path: internal/spec_timings.windows.json
          if-no-files-found: error

  # Closes the loop on the recording above. The three record jobs each produce
  # one platform's file on its own runner, so nothing but a fourth job can see
  # all three at once. It opens a pull request rather than pushing to master,
  # the way the release workflow does: a split balanced from bad numbers is a
  # slow suite rather than a broken one, but the diff is still worth a look.
  publish_timings:
    name: "Open a pull request with the recorded timings"
    needs: [record_macos, record_linux, record_windows]
    # A dispatch can run from any ref, and this cuts its branch from whatever is
    # checked out.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: spec-timings-*
          path: recorded
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          found=$(find recorded -name 'spec_timings.*.json' | wc -l)
          if [ "$found" -ne 3 ]; then
            echo "Expected three timing files, found $found:"
            find recorded -type f
            exit 1
          fi
          find recorded -name 'spec_timings.*.json' -exec cp {} internal/ \;

          if git diff --quiet -- internal/spec_timings.linux.json internal/spec_timings.mac.json internal/spec_timings.windows.json; then
            echo "The timings are unchanged. Nothing to open."
            exit 0
          fi

          branch="spec-timings-$(date -u +%Y-%m-%d)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -b "$branch"
          git add internal/spec_timings.linux.json internal/spec_timings.mac.json internal/spec_timings.windows.json
          git commit -m "[ci] Record the spec timings the split is balanced from"
          git push --force-with-lease origin "$branch"

          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "A pull request for $branch is already open, the push updated it."
            exit 0
          fi

          gh pr create --base master --head "$branch" \
            --title "Record the spec timings the split is balanced from" \
            --body "$(cat <<'BODY'
          Recorded by [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) of `Spec timings and random order split`.

          `rake test_parallel` packs the suite from measured per file durations, and they have to come from the platform they balance, because the suite is a different shape on each. Each file records where and when it was measured.

          A stale file costs a worse balanced split rather than a wrong result, so this is not urgent, but the numbers are worth a glance before merging. `recorded_on` in each file says which runner produced it.
          BODY
          )"
