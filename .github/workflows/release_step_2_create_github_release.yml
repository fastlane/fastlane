---
name: Release Step 2 - Create GitHub Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      skip_github_packages:
        description: 'Skip pushing to GitHub Packages'
        required: true
        default: false
        type: boolean
      skip_rubygems:
        description: 'Skip pushing to RubyGems'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  create_github_release:
    runs-on: macos-latest

    permissions:
      packages: write
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Ruby
      uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
      with:
        ruby-version: '3.4'

    - name: Install fastlane
      run: bundle install

    - name: Configure GitHub Packages config
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mkdir -p ~/.gem
        echo ":github: Bearer $GITHUB_TOKEN" > ~/.gem/credentials
        chmod 0600 ~/.gem/credentials

    - name: Run fastlane
      env:
        FASTLANE_RELEASE_API_BEARER: ${{ secrets.GITHUB_TOKEN }}
        SLACK_URL: ${{ secrets.SLACK_URL }}
      run: |
        bundle exec fastlane create_github_release skip_github_packages:${{ github.event.inputs.skip_github_packages }}

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: release_tag
        path: latest_fl_version.txt
        retention-days: 1

  release_rubygems:
    needs: create_github_release
    if: ${{ inputs.skip_rubygems != true }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      # The attestation patch loads the default openssl before Bundler, which would refuse our locked one - rubygems/release-gem/issues/28
      BUNDLE_WITHOUT: openssl_pin

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Ruby
      uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
      with:
        ruby-version: '3.4'
        bundler-cache: true

    - name: Release to RubyGems
      uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
